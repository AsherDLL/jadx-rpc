[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jadx-rpc"
version = "0.1.0"
description = "Headless jadx sessions for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
keywords = ["jadx", "android", "apk", "reverse-engineering", "decompiler", "llm", "agent", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
jadx-rpc = "jadx_rpc.cli:main"

[project.urls]
Homepage = "https://github.com/AsherDLL/jadx-rpc"
Issues = "https://github.com/AsherDLL/jadx-rpc/issues"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["jadx_rpc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
